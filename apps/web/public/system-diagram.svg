<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 640" width="560" height="640" role="img" aria-labelledby="sd-title sd-desc">
  <title id="sd-title">Shape of the system</title>
  <desc id="sd-desc">The internal admin frontend and its independently built sections sit above a GraphQL layer, which fans out to backend services owned by other teams. A shared component library is imported by every section, and a CI/CD pipeline builds and deploys the repository.</desc>

  <style>
    :root { color-scheme: light dark; }
    .box { fill: none; stroke: #5980a6; stroke-width: 1.25; }
    .box-soft { fill: none; stroke: #d2d4d6; stroke-width: 1.25; }
    .fill-soft { fill: #5980a6; fill-opacity: 0.06; }
    .label { fill: #1d1f20; font-family: 'Barlow Condensed', 'Barlow', system-ui, sans-serif; font-size: 22px; font-weight: 600; }
    .eyebrow { fill: #8f4e35; font-family: 'Barlow Condensed', 'Barlow', system-ui, sans-serif; font-size: 14px; letter-spacing: 0.16em; }
    .muted { fill: #63676b; font-family: 'Barlow', system-ui, sans-serif; font-size: 15px; }
    .flow { stroke: #5980a6; stroke-width: 1.5; fill: none; }
    .flow-dashed { stroke: #b4674a; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
    .arrowhead { fill: #5980a6; }
    .arrowhead-2 { fill: #b4674a; }

    @media (prefers-color-scheme: dark) {
      .box { stroke: #94bce3; }
      .box-soft { stroke: #3a5470; }
      .fill-soft { fill: #94bce3; fill-opacity: 0.08; }
      .label { fill: #f2f2f3; }
      .eyebrow { fill: #f0b795; }
      .muted { fill: #a8b4c0; }
      .flow { stroke: #94bce3; }
      .flow-dashed { stroke: #e09a76; }
      .arrowhead { fill: #94bce3; }
      .arrowhead-2 { fill: #e09a76; }
    }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrowhead" />
    </marker>
    <marker id="arrow-2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrowhead-2" />
    </marker>
  </defs>

  <!-- Admin frontend -->
  <rect x="20" y="20" width="502" height="170" class="box" />
  <text x="40" y="48" class="eyebrow">INTERNAL ADMIN FRONTEND</text>

  <rect x="40" y="66" width="150" height="104" class="box-soft fill-soft" />
  <text x="115" y="112" class="label" text-anchor="middle">Section A</text>
  <text x="115" y="138" class="muted" text-anchor="middle">own routes</text>

  <rect x="205" y="66" width="145" height="104" class="box-soft fill-soft" />
  <text x="277" y="112" class="label" text-anchor="middle">Section B</text>
  <text x="277" y="138" class="muted" text-anchor="middle">own routes</text>

  <rect x="370" y="66" width="132" height="104" class="box-soft" stroke-dasharray="4 4" />
  <text x="436" y="112" class="label" text-anchor="middle">Section C</text>
  <text x="436" y="138" class="muted" text-anchor="middle">in progress</text>

  <!-- GraphQL layer -->
  <rect x="20" y="238" width="500" height="96" class="box" />
  <text x="40" y="266" class="eyebrow">CONTRACT</text>
  <text x="40" y="296" class="label">GraphQL layer</text>
  <text x="40" y="320" class="muted">schema inherited · normalized client cache</text>

  <path d="M 200 190 L 200 238" class="flow" marker-end="url(#arrow)" />

  <!-- Backend services -->
  <rect x="20" y="382" width="500" height="76" class="box-soft" />
  <text x="40" y="410" class="eyebrow">OWNED BY OTHER TEAMS</text>
  <text x="40" y="440" class="label">Backend services</text>

  <path d="M 200 334 L 200 382" class="flow" marker-end="url(#arrow)" />

  <!-- Component library -->
  <rect x="20" y="506" width="330" height="114" class="box" />
  <text x="40" y="534" class="eyebrow">SHARED DEPENDENCY</text>
  <text x="40" y="564" class="label">Component library</text>
  <text x="40" y="588" class="muted">tokens · primitives · patterns</text>
  <text x="40" y="608" class="muted">imported by every section</text>

  <path d="M 20 563 L 8 563 L 8 105 L 20 105" class="flow-dashed" marker-end="url(#arrow-2)" />

  <!-- Pipeline -->
  <rect x="378" y="506" width="142" height="114" class="box-soft" />
  <text x="398" y="534" class="eyebrow">DELIVERY</text>
  <text x="398" y="564" class="label">CI/CD</text>
  <text x="398" y="588" class="muted">test · build</text>
  <text x="398" y="608" class="muted">deploy</text>
</svg>
